[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mytool"
version = "0.1.0"
description = "CI/CD pipeline security scanner: secrets, vulnerable dependencies, insecure code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "requests>=2.31",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
mytool = "mytool.cli:main"

[tool.setuptools.packages.find]
include = ["mytool*"]
