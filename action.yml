name: "mytool security scan"
description: >-
  Scan a repository for hardcoded secrets, vulnerable dependencies and
  insecure code patterns. Fails the build when findings meet the threshold.

inputs:
  path:
    description: Directory or file to scan (defaults to the repository root).
    required: false
    default: "."
  diff:
    description: >-
      Scan only the changes introduced relative to this ref (e.g.
      origin/main). Empty scans the whole path.
    required: false
    default: ""
  fail-on:
    description: Comma-separated severities that fail the build.
    required: false
    default: "high"
  no-deps:
    description: Set to "true" to skip the dependency (OSV) scan.
    required: false
    default: "false"

outputs:
  report:
    description: Path to the JSON report written for the run.
    value: ${{ steps.scan.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install mytool
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Run mytool scan
      id: scan
      shell: bash
      run: |
        args=()
        if [ -n "${{ inputs.diff }}" ]; then
          args+=(--diff "${{ inputs.diff }}")
        fi
        if [ "${{ inputs.no-deps }}" = "true" ]; then
          args+=(--no-deps)
        fi
        mytool scan "${{ inputs.path }}" "${args[@]}" \
          --fail-on "${{ inputs.fail-on }}" -o mytool-report.json
        echo "report=mytool-report.json" >> "$GITHUB_OUTPUT"

    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: mytool-report
        path: mytool-report.json
        if-no-files-found: ignore
