# Example GitLab CI job: fail the pipeline when mytool finds issues.
# Adjust the scanned path / severity threshold to your repository.

stages:
  - test

security-scan:
  stage: test
  image: python:3.11
  script:
    - pip install --quiet .
    - mytool scan . --fail-on high -o mytool-report.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - mytool-report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
