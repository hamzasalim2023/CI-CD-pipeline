name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -e ".[dev]"
      - run: python -m pytest -q

  dogfood:
    name: Scan this repository with mytool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet -e .
      - name: Run mytool on the package itself
        run: mytool scan mytool/ --no-deps --fail-on low
